# D-20 says to target the latest stable major and records a trigger for the one
# version deliberately held back — typescript-eslint widening its range to allow
# TypeScript 7. A written trigger nobody watches is a wish. This is what watches.
#
# Updates are grouped so a week produces one pull request rather than a dozen,
# and each one still has to pass the same gate as everything else.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      toolchain:
        patterns:
          ['typescript', '@typescript/*', 'typescript-eslint', 'eslint', '@eslint/*', 'prettier']
      everything-else:
        patterns: ['*']
        exclude-patterns:
          ['typescript', '@typescript/*', 'typescript-eslint', 'eslint', '@eslint/*', 'prettier']
    # knip 6.43 stops reading this repository's entry points (it reports 508 files as unused), so the
    # gate is held at 6.41. Remove this when a release reads the entries again; `bun run knip` passing
    # on the bump is the proof.
    ignore:
      - dependency-name: knip
        versions: ['>=6.42.0']
      # The types are the Bun runtime's version, which moves with the Dockerfile and packageManager together
      # (scripts/environment.test.ts), never alone.
      - dependency-name: '@types/bun'
    commit-message:
      prefix: chore

  # The Dockerfile's bases are pinned by digest, which only moves when this does.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore

  # Actions are pinned to commit SHAs (D-91, scripts/workflow-pins.test.ts), so a
  # new release can only arrive as a pull request from here. Removing this block
  # would freeze every action at the SHA it has today, silently.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore
