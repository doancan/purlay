# Whether the dependency tree can ship inside an AGPL-3.0 distribution (#247).
#
# Its own workflow so it can be required, or not, independently of the audit.
name: licences

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  licences:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      # An allow-list of licences that combine with AGPL-3.0, read from the
      # installed tree (scripts/licenses.ts). An unknown licence fails.
      - name: every installed package can ship inside an AGPL-3.0 distribution
        run: bun run check:licenses
