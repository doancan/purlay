# CI is the only authority on whether the checks pass. A claim in a pull request
# description is not evidence. (D-47, CONTRIBUTING.md §5)
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Only a pull request's superseded run is cancelled. On main every commit is
  # checked: cancelling the first of two quick merges left it never verified (#202).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Everything that needs no service: the types, the linters, the build and its budget, the guards. The
  # tests are not here — `schema` runs every one of them once, with coverage, and `verify` below is the
  # check that requires both (#791).
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading the pull request and the issues it names; nothing is written.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes; the token stays out of .git/config where later steps could read it.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # One source: package.json's packageManager field. Pinning it here as
          # well is how the pipeline and the repository end up on different
          # versions after a dependency bump, silently.
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # `head_ref` is the pull request's branch and is empty on a push, where
      # `ref_name` is the branch pushed to — so this judges a real name on both
      # triggers rather than failing on every merge to main. Passed as an
      # environment variable rather than interpolated into the shell, because a
      # branch name is attacker-controlled text.
      # One task, of a reviewable size, touching what it is about (#126). Only a
      # pull request has a body, labels and linked issues to judge.
      - name: the pull request names its task, fits the budget, and stays in scope
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: bun run check:pr "$PULL_REQUEST"

      # Every outside contribution under the contributor licence agreement (D-24, D-145): its
      # author has signed, and nobody signs for anybody else. Part of a required job, so an
      # unsigned pull request cannot be merged.
      - name: the author has signed the contributor licence agreement
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: bun run check:cla "$PULL_REQUEST"

      - name: the branch is named the way CONTRIBUTING.md §8 says
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: bun run check:branch

      - name: typecheck (TypeScript 7)
        run: bun run typecheck

      # The linter reasons with the TypeScript 6 API while typescript-eslint catches
      # up (D-20). Checking with both turns a disagreement between the two into a
      # CI failure rather than a mystery.
      - name: typecheck (TypeScript 6 API, the one the linter uses)
        run: bun run typecheck:ts6

      - name: lint
        run: bun run lint

      # An export nothing imports is wired up or deleted. The few things knip
      # cannot see are named in knip.jsonc, each with a reason. (#136)
      - name: unused files and exports
        run: bun run knip

      - name: format
        run: bun run format:check

      # A client that does not build is a client nobody can ship, and it fails in
      # a way no typecheck sees — a missing asset, a plugin that stopped
      # resolving, an entry that moved. The source map is kept (and not shipped) so the budget
      # below can show the shell holds none of chat's screens (D-250).
      - name: build the client
        run: bun run build:web:mapped

      # The initial JavaScript is measured from the build and blocks the merge above
      # 250 KB gzipped, naming the chunks. A budget nobody enforces is a hope (D-49, #140).
      - name: the initial JavaScript is inside its budget
        run: bun run budget:web

      # Proves the guardrails still exist. A rule that stops failing the build has
      # stopped being a rule, and that is a more expensive failure than a bug.
      - name: enforcement is still enforced
        run: bun run verify:enforcement

      # `.env.example` is generated from the configuration loader, so a variable
      # added without regenerating it is drift. This ran locally and nowhere else
      # until a test started comparing `verify` against this file in both
      # directions — a check that cannot block a merge is a suggestion.
      - name: .env.example is what the loader produces
        run: bun run config:example -- --check

      # The CSS custom properties, the Tailwind binding and the token names are
      # generated from `packages/tokens/tokens.json` (D-97). The same shape as the
      # check above and the database types before it: generated so it can be read,
      # checked so it cannot drift. The check also judges the source — soundness
      # and readable contrast — so a colour that stops being legible stops here.
      - name: the generated tokens are what the source produces
        run: bun run tokens:check

  # Whether this change can move what the browser tests see. Four browser jobs are most of a run's
  # minutes; a change to documents, the API alone or the scripts cannot change a screen, so on a pull
  # request they run only when one of these paths changed. On main they always run. The same for the
  # `modules` job, which starts the API and so reads the API, the packages and the dependencies, not the client.
  changes:
    runs-on: ubuntu-latest
    # The module matrix needs the dependencies installed: a minute or two with the cache cold.
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      browser: ${{ steps.paths.outputs.browser }}
      modules: ${{ steps.paths.outputs.modules }}
      mutations: ${{ steps.paths.outputs.mutations }}
      cells: ${{ steps.cells.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: bun run ci:changes
      # The legs of `module-suites` come from the modules the build carries, so a module added lists itself there.
      - run: bun install --frozen-lockfile
      - id: cells
        run: bun run modules:cells -- --github-output

  # A module's removal on a real process, once per cell of the matrix (D-250 rule 6, `MODULES.md` §8): for the core
  # alone, each module and everything, a database of its own is migrated with `bun run db:migrate` under that
  # `MODULES`, the API is started with the same value and no migration of its own, and every path every manifest
  # claims is asked for with every method — a module that runs asks who is calling, one that does not is the `404`
  # of an unknown path, byte for byte. Beside `schema` rather than after it, and a few seconds of work once the
  # database is up. The suites are run per cell by the `module-suites` job below, not here. The same job then migrates
  # every cell from the database the last release tag's own migrator made (`bun run modules:upgrade`), which needs the
  # tags: the checkout fetches them.
  modules:
    needs: changes
    if: needs.changes.outputs.modules == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://purlay:purlay@localhost:5432/purlay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes; the token stays out of .git/config where later steps could read it.
          persist-credentials: false
          # The last release tag is the starting point of `modules:upgrade`; a shallow checkout has none.
          fetch-tags: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: start the database
        run: bun run db:up:postgres

      - name: every cell of the module matrix, on a started API
        run: bun run modules:smoke

      - name: every cell migrated from the database the last release left
        run: bun run modules:upgrade

  # The integration suites that belong to no module, once per cell of the matrix but the one with every module (which
  # is `schema`'s own run): for each, a database of the cell's own sets with `MODULES` set — the harness reads it — and
  # the suites that need a module the cell lacks left out (`MODULES.md` §8). One job per cell, so the run takes as long as
  # the longest cell (chat's, about the length of `schema`) and not the sum; the legs are
  # `bun run modules:cells`, made from the modules the build carries, and `module-suites.test.ts` holds the workflow to that.
  module-suites:
    needs: changes
    if: needs.changes.outputs.modules == 'true'
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.changes.outputs.cells) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://purlay:purlay@localhost:5432/purlay
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: start the database and redis
        run: bun run db:up:tests

      - name: the suites that belong to no module, in this cell
        run: bun run modules:suites -- ${{ matrix.cell }}

  # The same native cohort as the functional suites, measured alone. Every eligible module cell and
  # both session kinds run once in fresh sequential processes; each retains the unchanged 200 ms bound.
  cohort-measurements:
    needs: changes
    if: needs.changes.outputs.modules == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://purlay:purlay@localhost:5432/purlay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: start the database
        run: bun run db:up:postgres
      - name: every native workspace cohort stays below 200 ms
        id: cohort
        run: bun run budget:workspace-cohort
      - name: keep every native cohort measurement
        if: always() && steps.cohort.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-cohort-${{ github.sha }}
          path: .budget/workspace-cohort
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # The mutations this pull request adds or changes, each applied to a copy of the tree and required to be caught
  # (`CONTRIBUTING.md` §5). `mutations.test.ts` only sees that an entry still applies; an equivalent or broken
  # mutant — one no test fails on — passed it, and was found months later (#1180). The ids come from diffing
  # `scripts/mutations/` against the merge-base, so the history is fetched. The whole list is the weekly
  # `mutations.yml`'s, not this job's. A change that touches no mutation file skips it, and the gate allows only that skip.
  mutations-changed:
    needs: changes
    if: needs.changes.outputs.mutations == 'true'
    name: mutations-changed (${{ matrix.index }}/${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        index: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    # A large changed list exceeded one job's 30 minutes. Disjoint shards retain every entry and
    # the same ceiling; needs.mutations-changed.result succeeds only when every shard does.
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://purlay:purlay@localhost:5432/purlay
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge-base with the base branch is the point the entries are compared with.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: start the database and redis
        run: bun run db:up:tests

      - name: every mutation this change adds or changes is caught
        env:
          # A pull request is measured against its base branch; a push to main against the commit it moved on from.
          BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || github.event.before }}
        run: bun run mutate --changed="$BASE" --shard=${{ matrix.index }}/${{ strategy.job-total }}

  # The browser tests: the production build and a seeded real API, in real Chromium,
  # in both themes and at two widths (#139). A job of its own because it needs a
  # database and a browser, which `bun run verify` deliberately does not. It is not in the
  # repository's required checks until its first week of runs has been read.
  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    # One job per project and part (playwright.config.ts): each has a runner to itself, so the suite fits
    # its time, and the measurements are taken on a machine nothing else is using (D-227) — beside the
    # suite rather than after it, so measuring alone adds no time to the run.
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-dark, chromium-light, chromium-dark-narrow, chromium-light-narrow]
        part: [suite, measurements]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://purlay:purlay@localhost:5432/purlay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes; the token stays out of .git/config where later steps could read it.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: start the database
        run: bun run db:up:postgres

      - name: start the pinned browser server
        timeout-minutes: 10
        uses: ./.github/actions/browsers

      # Everything but the files that write a measurement: those run in the other part, alone (D-227).
      - name: the browser tests
        if: matrix.part == 'suite'
        run: bun run test:e2e
        env:
          PURLAY_E2E_PROJECT: ${{ matrix.project }}
          PURLAY_E2E_PERFORMANCE: skip

      # The frame on a server that runs no module (D-250): the same build and the same seeded world, served with
      # MODULES=none, in a real browser — no chat route asked for, no chat screen drawn, no console error.
      - name: the browser with no module
        if: matrix.part == 'suite'
        run: bun run test:modules-none
        env:
          PURLAY_E2E_PROJECT: ${{ matrix.project }}

      # The measuring tests by themselves, on one worker: inside the parallel run another test competed
      # for the runner while they measured, and the same code's cold load read anywhere from 86 to 178 ms.
      - name: the browser measurements, alone
        if: matrix.part == 'measurements'
        run: bun run test:e2e -- --workers=1
        env:
          PURLAY_E2E_PROJECT: ${{ matrix.project }}
          PURLAY_E2E_PERFORMANCE: only

      # Cold load, keystroke to paint and the channel switch (D-49), as the tests above measured
      # them: blocking on a regression against the slowest of main's last runs of this project, never on the line,
      # which a hosted runner sits far above. A regression is measured again, alone, and fails only if it
      # repeats (`--remeasure`, D-227). Kept and shared as the latency budgets are (#73).
      - name: the last browser measurement on main
        if: matrix.part == 'measurements'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .budget/browser-${{ matrix.project }}.json
          key: budget-browser-${{ matrix.project }}-${{ github.sha }}
          restore-keys: budget-browser-${{ matrix.project }}-
      - name: the browser budgets hold against main's last measurement
        if: matrix.part == 'measurements'
        run: bun run budget:browser -- --project ${{ matrix.project }} --keep .budget/browser-${{ matrix.project }}.json --remeasure
      - name: keep this measurement as main's baseline
        if: matrix.part == 'measurements' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .budget/browser-${{ matrix.project }}.json
          key: budget-browser-${{ matrix.project }}-${{ github.sha }}

      # Only when something failed: the report and the traces are how a screenshot that
      # differs is looked at, and the screenshots that were written are how it is judged.
      - name: keep the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.part }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: stop the browser server
        if: always() && env.CI_BROWSER_CONTAINER_ID != ''
        uses: ./.github/actions/browsers
        with:
          cleanup: 'true'

  # The same browser tests on Safari's engine, one job beside the Chromium ones: light, 1440 wide, no
  # screenshots (a baseline is one engine's), and none of the measuring files — a latency line is
  # Chromium's claim and a hosted runner's number is not a person's (D-49, D-227). What WebKit cannot
  # do as the suite asks is skipped in the test, by engine and with why (`docs/spikes/cross-browser.md`).
  # Reported, not required: it is not in `verify`'s `needs`, so a red run shows on the pull request
  # and blocks nothing. To promote it once it has been green for a while, see CONTRIBUTING.md §5.
  webkit:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    # Main 2026-11-07: setup plus 271 passing tests exhausted 12 minutes (1.4 + 10.6).
    # Match Chromium's total job envelope; test, assertion and performance limits stay unchanged.
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://purlay:purlay@localhost:5432/purlay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes; the token stays out of .git/config where later steps could read it.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: start the database
        run: bun run db:up:postgres

      - name: start the pinned browser server
        timeout-minutes: 10
        uses: ./.github/actions/browsers

      - name: the browser tests on WebKit
        run: bun run test:e2e
        env:
          PURLAY_E2E_PROJECT: webkit
          PURLAY_E2E_PERFORMANCE: skip

      - name: keep the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-webkit
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: stop the browser server
        if: always() && env.CI_BROWSER_CONTAINER_ID != ''
        uses: ./.github/actions/browsers
        with:
          cleanup: 'true'

  # Requires a database, which is why it is a job of its own rather than part of
  # `bun run verify` — that stays the subset a developer can run with nothing
  # installed. The database comes from docker-compose.yml so the image is
  # declared in exactly one place. (D-45)
  schema:
    runs-on: ubuntu-latest
    # Main 2026-11-12: 25,894 passing tests took 1,108 s; setup, schema and the real performance
    # measurements exhausted the old 20-minute job ceiling during latency trials. Leave headroom
    # for the complete gate; test timeouts, coverage and performance budgets remain unchanged.
    timeout-minutes: 30
    # Declared once for the job. The development credentials are the compose
    # file's; a test fails if this, the schema check's default and the compose
    # file stop agreeing.
    env:
      DATABASE_URL: postgres://purlay:purlay@localhost:5432/purlay
      REDIS_URL: redis://localhost:6379
      # The job's own database, which exists for nothing else: db:check may migrate it.
      PURLAY_ALLOW_DB_CHECK_ON: purlay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes; the token stays out of .git/config where later steps could read it.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # One source: package.json's packageManager field. Pinning it here as
          # well is how the pipeline and the repository end up on different
          # versions after a dependency bump, silently.
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # PostgreSQL and Redis (the shared bus, limiters and presence, D-201), started together and each
      # waited on until its health check passes. From docker-compose.yml, so each image is named in one
      # place. No object storage: nothing the integration tests reach reads it yet, so starting it would
      # cost a pull and a bootstrap for a service no test uses. The first test that reads attachments adds it (#53).
      - name: start the database and redis
        run: bun run db:up:tests

      - name: the committed types are exactly what the migrations produce
        run: bun run db:check

      # Every test with a database, held to the coverage floor in bunfig.toml —
      # the same command `verify` runs. Refuses here if the database is missing.
      - name: every test, with coverage
        run: bun run test:all

      # PRD.md §5's other blocking budget (D-49): a real API, started and settled, under 120 MiB.
      - name: the API's idle memory is inside its budget
        run: bun run budget:api

      # The ACK round-trip and fan-out p95 (D-49): measured on two real sockets, and blocking on a
      # regression against the last measurement on main — never on the line itself, which a shared
      # runner moves by tens of percent. A pull request reads main's baseline (the cache is shared
      # downward); only main writes one, and only after its own run passed, so a regression that
      # reached main fails there and does not become the new normal (#73).
      - name: the last latency measured on main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .budget/latency.json
          key: budget-latency-${{ github.sha }}
          restore-keys: budget-latency-
      - name: the latency budgets hold against main's last measurement
        id: latency
        run: bun run budget:latency -- --keep .budget/latency.json --record .budget/latency-current.json
      # The baseline is never replaced by a regression. Keep its raw trials separately,
      # including on a failed comparison, so the next investigation has more than one p95.
      - name: keep the current latency trials
        if: always() && steps.latency.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-latency-${{ github.sha }}
          path: .budget/latency-current.json
          include-hidden-files: true
          retention-days: 7
      - name: keep this measurement as main's baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .budget/latency.json
          key: budget-latency-${{ github.sha }}

  # The required check named `verify`: the static checks and every test, as one verdict (#791). It runs
  # whatever happened before it — a job whose dependency failed is skipped by default, and branch protection
  # counts a skipped required check as passed — and passes only when each job it needs succeeded.
  verify:
    needs:
      [
        static,
        schema,
        changes,
        browser,
        modules,
        module-suites,
        cohort-measurements,
        mutations-changed,
      ]
    if: always()
    runs-on: ubuntu-latest
    # Checkout and Bun's download, then a few milliseconds of judging; the margin is for a slow download.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes; the token stays out of .git/config where later steps could read it.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Nothing to install: the gate imports nothing.
      - name: the static checks and every test succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bun run ci:gate

  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes; the token stays out of .git/config where later steps could read it.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # One source: package.json's packageManager field. Pinning it here as
          # well is how the pipeline and the repository end up on different
          # versions after a dependency bump, silently.
          bun-version-file: package.json
      - name: cross-document references resolve
        run: bun run check:docs
