# Publish only tested releases from main. Dockhand pulls their images (D-262); Actions never
# runs on the production server. Both the commit's ci and image push runs must succeed (D-229).
name: deploy

on:
  # Either may finish last; the second completion can publish the tested release.
  workflow_run:
    workflows: [ci, image]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full hash on main to retry release publication (empty: the tip of main)'
        required: false
        type: string

# Serialize publication so two completions do not publish the same version at once.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # On GitHub's runner, not the server's: asking GitHub about runs needs nothing the server holds.
  gate:
    # Manual runs must use the workflow from main and a commit on main.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # To read the commit's ci and image runs.
      actions: read
    outputs:
      ready: ${{ steps.verdict.outputs.ready }}
      commit: ${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: the commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "give a full 40-digit commit hash" >&2; exit 1; }
          status="$(gh api "repos/$REPOSITORY/compare/main...$COMMIT" --jq .status)"
          case "$status" in
            behind | identical) echo "$COMMIT is on main ($status)" ;;
            *) echo "$COMMIT is not on main (compare says: $status)" >&2; exit 1 ;;
          esac

      # The commit's push run of each workflow, newest first: both completed and successful permits publication;
      # either still running waits for its own completion to start this again; anything else refuses.
      # A hand-started run cannot wait, so a run still going refuses it too. A commit inside a rebased
      # merge has no runs of its own (CI runs on the pushed tip), and is refused: it was never tested.
      - name: the commit passed ci and published its image
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}
          BY_HAND: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "give a full 40-digit commit hash" >&2; exit 1; }
          ready=true
          for workflow in ci.yml image.yml; do
            run="$(gh api "repos/$REPOSITORY/actions/workflows/$workflow/runs?head_sha=$COMMIT&event=push&branch=main&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')"
            case "$run" in
              "completed success") echo "$workflow: succeeded" ;;
              queued* | in_progress* | waiting* | pending* | requested*)
                [ "$BY_HAND" != true ] || { echo "$workflow is still running for $COMMIT; retry publication when it has finished" >&2; exit 1; }
                echo "$workflow is still running; its completion retries publication"
                ready=false
                ;;
              *) echo "$workflow did not succeed for $COMMIT (${run:-no run}); nothing is published" >&2; exit 1 ;;
            esac
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

  release:
    # Publication is independent of a server's availability. This is not a deployment receipt.
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Create the tag and the GitHub Release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false

      # The release carries the contract bundle (D-192), which is built from the repository's own code.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: tag and publish the version, if it is a new one
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: scripts/release-publish.sh "$(git rev-parse HEAD)"
