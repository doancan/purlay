# A backup is restored on a schedule, not once (#248, D-95; D-44).
#
# `scripts/restore-rehearsal.sh` brings up a throwaway copy of the production stack,
# fills it, backs it up, restores into a new database and bucket, and fails unless the
# two are identical; then it destroys every volume and rebuilds from the backup alone.
# Weekly, and on any change to the scripts or the stack they run against.
name: restore-rehearsal

on:
  pull_request:
    paths:
      - scripts/backup.sh
      - scripts/restore.sh
      - scripts/compare-databases.sh
      - scripts/ops-common.sh
      - scripts/production-init.sh
      - scripts/restore-rehearsal.sh
      - scripts/rehearsal-*.ts
      - scripts/bucket-*.ts
      - docs/spikes/backup-restore.seed.sql
      - docker-compose.production.yml
      - docker/garage.production.toml
      - Dockerfile
      - packages/db/migrations/**
      - .github/workflows/restore-rehearsal.yml
  schedule:
    # Weekly, Wednesday morning UTC.
    - cron: '23 5 * * 3'

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds the image itself, so the rehearsal runs against the code in this
      # commit. The secrets it generates are throwaway and die with the stack.
      - name: back up, restore into a fresh database and bucket, compare, then rebuild after a total loss
        run: scripts/restore-rehearsal.sh
