# The API image: built and run on every pull request, published from main (#248, D-87).
#
# A pull request builds the image and runs it against the compose PostgreSQL —
# `scripts/image-smoke.sh` — and pushes nothing. A push to main builds the same
# thing and publishes it to GHCR with provenance and an SBOM attached as
# attestations.
#
# The publish job can only be exercised for real after this workflow is on main:
# a pull request has no GHCR credentials by design. What a pull request does prove
# is that the image builds and starts.
name: image

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/image.yml
      - apps/api/**
      - packages/db/**
      - packages/types/**
      - bun.lock
      - package.json
      - scripts/image-smoke.sh
      - docker-compose*.yml
  push:
    branches: [main]

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build the image (nothing is pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: purlay-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The smoke test starts a PostgreSQL of its own on a private network; nothing here has to.
      - name: the image starts read-only, answers liveness and readiness, and is not root
        run: scripts/image-smoke.sh purlay-api:ci

  publish:
    # Only from main, only after the build above has passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Push the image to this repository's container registry.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Tags: the commit, and `main` for the latest build of the branch. No
      # `latest`: an operator pins a commit or a release, never a moving word.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=sha,format=long
            type=ref,event=branch
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA provenance describing how it was built, and the SBOM of what is in
          # it, attached to the image as attestations.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
