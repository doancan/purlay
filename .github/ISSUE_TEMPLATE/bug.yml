name: Bug
description: Something behaves differently from what the documents specify.
title: 'What breaks, in 50–70 characters'
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **A cross-tenant or cross-channel leak is critical severity.** If a user can see data from
        a workspace or a channel they are not in, say so in the title and label it `security`.
  - type: textarea
    id: expected
    attributes:
      label: What the documents say should happen
      description: Cite the document and section. If nothing specifies it, this is an open question, not a bug.
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: What actually happens
      description: Exact output, exact status code, exact error. Not a paraphrase.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest sequence that produces it.
    validations: { required: true }
  - type: checkboxes
    id: fix-discipline
    attributes:
      label: Fix discipline
      options:
        - label: 'A regression test is written **before** the fix, and fails first'
        - label: 'The caught error is handled or re-thrown — never logged and stepped over'
        - label: 'If the documents were wrong rather than the code, they are corrected in the same change'
