name: Task
description: A unit of work that already has a decision behind it.
title: 'Short imperative title, 50–70 characters'
body:
  - type: markdown
    attributes:
      value: |
        **Before opening this:** check the phase. A task belonging to a later phase is not built
        early, and a permanent non-goal is not built at all (`docs/PRD.md` §4, §6).

        If the specification is silent on something this task needs, stop and ask. The open
        questions are `docs/DECISIONS.md` Part D — hitting one is a decision to be made, not a
        gap to be filled quietly.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this exists, and which decision it rests on. Cite the D-number.
      placeholder: 'D-21 singles this defect class out as silent, unbounded and unrecoverable, so…'
    validations: { required: true }
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What gets built. Bullets.
    validations: { required: true }
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What is deliberately not here, and where it lives instead.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Apply the matching label after opening.
      options: [api, web, database, realtime, contracts, infra, docs]
    validations: { required: true }
  - type: checkboxes
    id: dod
    attributes:
      label: 'Definition of done — the part a machine cannot check'
      description: >-
        typecheck, lint, tests, the enforcement demonstration and the document
        check are required status checks; a merge is blocked without them. Ticking
        a box for what CI already refuses is theatre, and a checklist whose items
        are theatre stops being read. What is left is what only a person can
        confirm. Which tests must exist is `ARCHITECTURE.md` §10.
      options:
        - label: 'Documentation updated **in the same change** — schema → `SCHEMA.md`, protocol → `ARCHITECTURE.md`, scope → `PRD.md`, a non-obvious choice → a numbered decision in `DECISIONS.md` with what was rejected'
        - label: 'The change is the minimal delta the task requires; no unrelated refactor rode along'
        - label: 'Shapes defined in `@purlay/types` **before** any implementation, if this touches a contract'
        - label: 'A violation was fixed rather than waived — no rule loosened to make this pass'
  - type: textarea
    id: specific
    attributes:
      label: Specific to this issue
      description: The acceptance criterion only this task has. Be concrete enough to fail.
      placeholder: 'A repository method called without a `WorkspaceContext` fails to compile.'
