# Purlay on a server managed with Dockhand, behind Nginx Proxy Manager (docs/DEPLOY.md, D-258).
#
# The same stack as docker-compose.production.yml — the API, the scheduler, PostgreSQL and Garage — in
# ONE file, so it can be pasted into Dockhand's editor or deployed from Git without a checkout beside it:
# Garage's configuration, which the production stack mounts from `docker/`, is written inline below
# (`configs: content:`, Docker Compose 2.23.1 or later). What differs, and only this
# (scripts/dockhand-compose.integration.test.ts holds the rest equal):
#
# - **No Caddy: the API's own port is published**, on `PURLAY_HTTP_PORT` (bound to `PURLAY_HTTP_BIND`,
#   every address unless set), for Nginx Proxy Manager — on this server or another — which holds 80
#   and 443 and the certificate. In Nginx Proxy Manager, forward the domain to
#   `http://<this server>:<PURLAY_HTTP_PORT>` with Websockets Support on. The port speaks plain HTTP:
#   bind it to an address only the proxy reaches where the network is not your own.
#   Nginx Proxy Manager is the one proxy `TRUST_PROXY` means (D-81): it must send the client as the
#   last X-Forwarded-For entry, which it does unless Cloudflare is in front of it (docs/CONFIG.md).
#   What Caddy did is the proxy's or the API's: /metrics answers 404 without METRICS_TOKEN (D-221),
#   and a request made while the API restarts fails rather than waits.
# - WAL archiving (D-202) is not offered: it needs a script mounted into PostgreSQL. Back up with
#   the database's own dumps, or use docker-compose.production.yml when point-in-time recovery is
#   wanted.
#
# Its inputs are the variables of docker-compose.production.yml (docs/CONFIG.md), without
# HTTP_PORT, HTTPS_PORT, PROXY_MEMORY_LIMIT and the WAL_ARCHIVE ones, and with PURLAY_HTTP_PORT
# (required), PURLAY_HTTP_BIND, and the backup's BACKUP_EVERY_MINUTES, BACKUP_KEEP and
# BACKUP_MEMORY_LIMIT. Set them in Dockhand's environment for the stack.

# Every container's log, bounded: Docker's json-file driver keeps everything unless told, and a
# server whose disk its own logs filled stops writing the database next. Five files of 50 MB each per
# service: for the API that is weeks of a team's requests, enough for the stretch `bun run
# report:frames` reads (O-4); export it with `docker compose logs api` before it rolls over.
x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: '5'

# What the API and the scheduler share: one image, the same settings and the same
# hardening, so a job reads exactly the configuration the API does (D-30).
x-application: &application
  image: ${PURLAY_IMAGE:?set PURLAY_IMAGE to the API image, ideally by digest (docs/CONFIG.md)}
  restart: unless-stopped
  logging: *logging
  # Read-only root filesystem, no capabilities, no privilege escalation: the
  # image is built to run this way and `scripts/image-smoke.sh` runs it so.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

x-environment: &environment
  NODE_ENV: production
  APP_URL: ${APP_URL:?set APP_URL to the one public https origin}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Which modules this stack runs; blank is every one. The API, the jobs and the commands read the same (D-250).
  MODULES: ${MODULES:-}
  # What a workspace with no grant of its own may use of them: `open` (blank is open) or `managed` (D-289).
  WORKSPACE_MODULES: ${WORKSPACE_MODULES:-}
  # Enable only after every API, scheduler and job reader runs guest-capable code (D-300).
  GUEST_ACCESS_READY: ${GUEST_ACCESS_READY:-false}
  # Kept with production for the scheduler; the API uses its built-in read-only receipt volume below.
  BACKUP_STATUS_DIRECTORY: ${BACKUP_STATUS_DIRECTORY:-}
  DATABASE_URL: postgres://purlay:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/purlay
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  # Facts one workspace may have waiting for one module; a publish past it is refused (docs/DEPLOY.md).
  OUTBOX_PENDING_MAX: ${OUTBOX_PENDING_MAX:-5000}
  OUTBOX_DEAD_KEPT_DAYS: ${OUTBOX_DEAD_KEPT_DAYS:-180}
  # Sockets this node holds open before it answers 503; size by measured fan-out (docs/DEPLOY.md).
  SOCKET_MAX_CONNECTIONS: ${SOCKET_MAX_CONNECTIONS:-2000}
  # Sockets that may replay at once after a reconnect; the rest wait their turn (docs/DEPLOY.md).
  SOCKET_REPLAY_CONCURRENCY: ${SOCKET_REPLAY_CONCURRENCY:-50}
  # Inside the stack's network; managed PostgreSQL is a different deployment.
  # Production refuses an unencrypted database link unless told the network is
  # private (D-79), and here it is: a compose network no other host can join.
  DATABASE_SSL: 'false'
  DATABASE_ALLOW_PLAINTEXT: 'true'
  # A seed of the server's settings, read on the first start only (D-179 §6): both or neither, and
  # empty is neither — the server then waits in setup mode for the wizard to connect GitHub (R38).
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  # The organisation's OpenID Connect provider (D-200), a seed read on the first start only: all three or none,
  # empty is none — single sign-on is then off, and nothing is sent to anybody.
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_NAME: ${OIDC_NAME:-}
  # Google's OAuth client (D-251), a seed read on the first start only: both or neither, empty is neither.
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  # The GitHub App issues are written through (D-246), a seed read on the first start only: all six or none,
  # empty is none — nothing of GitHub issues is then offered.
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
  GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
  GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
  GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
  # Where GitHub is: github.com and its API unless set, for a GitHub Enterprise Server. Empty is unset.
  GITHUB_URL: ${GITHUB_URL:-}
  GITHUB_API_URL: ${GITHUB_API_URL:-}
  # Whether the server asks GitHub which release is newest, for About (D-248). `false` and it never does.
  UPDATE_CHECK: ${UPDATE_CHECK:-true}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY (32 bytes, base64)}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
  # Who may make a workspace: GitHub logins, or `*`. Unset, only the first person in (D-155).
  WORKSPACE_CREATORS: ${WORKSPACE_CREATORS:-}
  # Off unless set; nothing is reported by default (D-44, D-96).
  ERROR_TRACKING_DSN: ${ERROR_TRACKING_DSN:-}
  # The attachment bucket (CONFIG.md, D-109); production refuses to start without it.
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://garage:3900
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-purlay-attachments}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  # Web Push (#78, D-126): all three or none, and empty is none — push off, which the API says.
  # `--env-file` only fills the placeholders in this file, so a variable not named here never
  # reaches the container, whatever production.env says.
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  # Email sign-in (D-138): both or neither, and empty is neither — GitHub sign-in only.
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-}
  SMTP_ALLOW_PLAINTEXT: ${SMTP_ALLOW_PLAINTEXT:-false}
  # The lowest an installed macOS client may be and still be served (D-186): empty is no limit, which the
  # configuration reads as unset. Named here or it never reaches the container, whatever production.env says.
  MIN_CLIENT_MACOS_CONTRACT: ${MIN_CLIENT_MACOS_CONTRACT:-}
  MIN_CLIENT_MACOS_VERSION: ${MIN_CLIENT_MACOS_VERSION:-}
  MACOS_DOWNLOAD_URL: ${MACOS_DOWNLOAD_URL:-}

services:
  api:
    <<: *application
    # Measured bounds, not a guess (docs/spikes/resources.md, #639): a runaway takes this
    # container down, not the host. Raised with API_MEMORY_LIMIT on a larger server.
    mem_limit: ${API_MEMORY_LIMIT:-768m}
    pids_limit: 256
    # The process drains for up to ten seconds (D-72); give it a margin to exit
    # before the runtime kills it.
    stop_grace_period: 15s
    # The one published port, for Nginx Proxy Manager: plain HTTP (see the head of this file).
    ports:
      - '${PURLAY_HTTP_BIND:-0.0.0.0}:${PURLAY_HTTP_PORT:?set PURLAY_HTTP_PORT to the port Nginx Proxy Manager forwards to}:3001'
    environment:
      <<: *environment
      PORT: '3001'
      BACKUP_STATUS_DIRECTORY: /var/lib/purlay-backup-status
      # The proxy is the only thing in front of it.
      TRUST_PROXY: 'true'
      # One node, or several: one takes the lock and migrates, the rest wait (D-93).
      MIGRATE_ON_START: 'true'
      # The bearer token a scraper reads /metrics with (D-221); empty is off. Here no Caddy refuses
      # /metrics from outside, so set it only once Nginx Proxy Manager refuses that path itself.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - backup-status:/var/lib/purlay-backup-status:ro
    depends_on:
      postgres:
        condition: service_healthy
      # The store is prepared before the API can be asked to use it.
      storage-init:
        condition: service_completed_successfully
    # The image's own HEALTHCHECK (readiness) applies; compose adds nothing.

  # Prepares the object store on every `up`, then exits (#76, D-144): the node's
  # place in the layout, the bucket, the application's key and its rights, each only
  # if missing, through Garage's admin API — and fails, holding the API back, if an
  # anonymous read of the bucket is not refused. The API image, with only the
  # variables it needs.
  storage-init:
    <<: *application
    command: ['apps/api/src/cli/storage-init.ts']
    # Measured bounds, not a guess (docs/spikes/resources.md, #639): a runaway takes this
    # container down, not the host. Raised with STORAGE_INIT_MEMORY_LIMIT on a larger server.
    mem_limit: ${STORAGE_INIT_MEMORY_LIMIT:-256m}
    pids_limit: 64
    restart: 'no'
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN (openssl rand -hex 32)}
      S3_ENDPOINT: http://garage:3900
      S3_BUCKET: ${S3_BUCKET:-purlay-attachments}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    depends_on:
      garage:
        condition: service_healthy
    # It is no server: the image's check asks a port this container never opens.
    healthcheck:
      disable: true

  # The scheduled jobs (D-30): one container however many API nodes there are, so a
  # job runs once, and shipped here so it is installed by `up`, not remembered. Each
  # run is recorded; `bun apps/api/src/cli/jobs.ts jobs:status` in it says when each
  # last succeeded, and is its healthcheck.
  scheduler:
    <<: *application
    command: ['apps/api/src/cli/schedule.ts']
    # Measured bounds, not a guess (docs/spikes/resources.md, #639): a runaway takes this
    # container down, not the host. Raised with SCHEDULER_MEMORY_LIMIT on a larger server.
    mem_limit: ${SCHEDULER_MEMORY_LIMIT:-512m}
    pids_limit: 128
    # A job already running is let finish.
    stop_grace_period: 60s
    environment:
      <<: *environment
    # After the API is ready, so its migrations are applied before a job runs.
    depends_on:
      api:
        condition: service_healthy
    # Not the image's check, which asks the API's port: the jobs' own report (#635). A
    # job overdue or failing since its last success makes the container unhealthy, which
    # `docker ps` and any monitor of container health see. Unhealthy is a signal, not a
    # restart: the jobs are retried on their own schedule. The start leaves room for the
    # first run of every job.
    healthcheck:
      test: ['CMD', '/usr/local/bin/bun', 'apps/api/src/cli/jobs.ts', 'jobs:status']
      interval: 1m
      timeout: 20s
      retries: 1
      start_period: 10m

  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    logging: *logging
    # Measured bounds, not a guess (docs/spikes/resources.md, #639): a runaway takes this
    # container down, not the host. Raised with POSTGRES_MEMORY_LIMIT on a larger server.
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1536m}
    pids_limit: 256
    environment:
      POSTGRES_USER: purlay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: purlay
      # Identifier columns declare COLLATE "C" (D-40) and readiness refuses a
      # database that disagrees; initialise it the way development does.
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    volumes:
      # /var/lib/postgresql, not .../data: PostgreSQL 18 and the later
      # `pg_upgrade --link` (ARCHITECTURE.md §11).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U purlay -d purlay']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Database dumps on a schedule (D-262): Dockhand's auto-update replaces the API without the backup
  # `scripts/deploy.sh` takes before a switch, so one is never more than BACKUP_EVERY_MINUTES old. The
  # PostgreSQL image, for its pg_dump; a dump is written aside and renamed, so a file named
  # `purlay-*.dump` is always whole, and only the newest BACKUP_KEEP are kept. Restore with pg_restore
  # from this container (docs/DEPLOY.md).
  backup:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    logging: *logging
    mem_limit: ${BACKUP_MEMORY_LIMIT:-256m}
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      PGHOST: postgres
      PGUSER: purlay
      PGDATABASE: purlay
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BACKUP_EVERY_MINUTES: ${BACKUP_EVERY_MINUTES:-60}
      BACKUP_KEEP: ${BACKUP_KEEP:-48}
    entrypoint: ['sh', '-c']
    command:
      - |
        set -eu
        every="$${BACKUP_EVERY_MINUTES}"
        keep="$${BACKUP_KEEP}"
        case "$$every" in '' | *[!0-9]* | 0) echo "BACKUP_EVERY_MINUTES must be a whole number, 1 or more, not '$$every'" >&2; exit 1 ;; esac
        case "$$keep" in '' | *[!0-9]* | 0) echo "BACKUP_KEEP must be a whole number, 1 or more, not '$$keep'" >&2; exit 1 ;; esac
        while true; do
          name="purlay-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          if pg_dump --format=custom --no-owner --no-acl --file="/backups/.$$name.partial" \
            && pg_restore --list "/backups/.$$name.partial" >/dev/null \
            && mv "/backups/.$$name.partial" "/backups/$$name"; then
            digest="$$(sha256sum "/backups/$$name" | cut -c 1-64)"
            bytes="$$(wc -c <"/backups/$$name" | tr -d ' ')"
            printf '{"version":1,"source":"dockhand","completedAt":"%s","scope":"database","databaseSha256":"%s","databaseBytes":"%s","maxAgeSeconds":%s}\n' \
              "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$$digest" "$$bytes" "$$((every * 120 + 300))" >/status/.backup.tmp
            chmod 644 /status/.backup.tmp
            mv /status/.backup.tmp /status/backup.json
            echo "backup: wrote $$name"
          else
            rm -f "/backups/.$$name.partial"
            echo "backup: pg_dump failed; the newest whole dump is kept" >&2
          fi
          ls -1t /backups/purlay-*.dump 2>/dev/null | tail -n +$$((keep + 1)) | xargs -r rm -f --
          sleep $$((every * 60))
        done
    volumes:
      - backups:/backups
      - backup-status:/status
    depends_on:
      postgres:
        condition: service_healthy
    # Unhealthy when the newest dump is older than two intervals: a backup that stopped is seen in
    # Dockhand, not found on the day it is needed.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'test -n "$$(find /backups -name ''purlay-*.dump'' -mmin -$$((BACKUP_EVERY_MINUTES * 2 + 5)))"',
        ]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 10m

  # Garage: S3-compatible object storage (docs/spikes/object-storage.md). Its image
  # has no shell, so the layout, bucket and key are prepared by the `storage-init`
  # service on every `up` (D-144).
  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    restart: unless-stopped
    logging: *logging
    # Measured bounds, not a guess (docs/spikes/resources.md, #639): a runaway takes this
    # container down, not the host. Raised with GARAGE_MEMORY_LIMIT on a larger server.
    mem_limit: ${GARAGE_MEMORY_LIMIT:-512m}
    pids_limit: 128
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET (64 hex characters)}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN (openssl rand -hex 32)}
    configs:
      - source: garage
        target: /etc/garage.toml
    volumes:
      - garage-data:/var/lib/garage
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

configs:
  # docker/garage.production.toml, as it is: a test keeps the two the same.
  garage:
    content: |
      # Garage for the production compose (docker-compose.production.yml, D-94).
      #
      # A single node. The RPC secret is not in this file: Garage reads it from
      # GARAGE_RPC_SECRET, which the compose file takes from the deployment's variables.
      # The S3 port is bound inside the stack's network and published nowhere; only the
      # API reaches it. The cluster layout, the bucket and the key are created on every
      # `up` by the one-shot `storage-init` service, through the admin API below, whose
      # token Garage reads from GARAGE_ADMIN_TOKEN (#76, D-144); it too is published
      # nowhere.
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1
      # Each write is on the disk before it is acknowledged (#639): without these a power cut can lose the
      # metadata of files the API was told were stored. Measured: p95 of a 256 KiB write 3.1 -> 5.6 ms,
      # p50 unchanged (docs/spikes/resources.md).
      metadata_fsync = true
      data_fsync = true

      rpc_bind_addr = "0.0.0.0:3901"
      rpc_public_addr = "127.0.0.1:3901"

      [s3_api]
      s3_region = "us-east-1"
      api_bind_addr = "0.0.0.0:3900"
      # No `public_endpoint` (Garage v2.5 recommends one): it is for objects served at a public URL, and
      # none is — the port is published nowhere and every download goes through the API (D-16).

      [admin]
      api_bind_addr = "0.0.0.0:3903"

volumes:
  postgres-data:
  garage-data:
  # The dumps the backup service writes; back this volume up off the server as well.
  backups:
  # Operational metadata only; the API never mounts the archives.
  backup-status:
