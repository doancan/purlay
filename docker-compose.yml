# The local development environment: PostgreSQL and object storage, and Redis for the tests of the
# cloud's shared adapters alone.
#
# `bun run db:up` starts PostgreSQL and object storage, and **no Redis**: a self-hosted instance never needs
# one and never will, and nothing the application does without `REDIS_URL` reaches it. `bun run db:up:redis`
# starts it, for the tests of the shared bus, limiters and presence (D-201, D-7, D-25).
#
# Every image is pinned. A floating tag would make "target the latest stable
# major, and say so" (D-20) untrue the first time upstream moved, silently.

name: purlay

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: purlay
      POSTGRES_PASSWORD: purlay # development only; production comes from DATABASE_URL
      POSTGRES_DB: purlay
      # Identifier columns declare COLLATE "C" so uniqueness never depends on how
      # the server was provisioned (D-40). The cluster locale is pinned as well, so
      # a developer's machine and a reviewer's behave identically.
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    ports:
      # Overridable: 5432 is conventional and frequently already taken. A port
      # collision is exactly the friction that turns "self-hosts from the README"
      # into a support ticket (PRD.md §3, S-2).
      # Bound to the loopback address: the superuser's password is published in this file,
      # and a mapping without an address listens on every interface of the machine.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18+ wants a single mount at /var/lib/postgresql rather than at
      # .../data: the data directory then sits inside the volume, so a later
      # `pg_upgrade --link` does not have to cross a mount boundary. Getting this
      # wrong is invisible until the first major upgrade — which, for a
      # self-hosted product, is an operator's problem we would have created.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # `docker compose up` is only deterministic if readiness is defined. Without
      # this, the migration runner races the database on a cold start.
      test: ['CMD-SHELL', 'pg_isready -U purlay -d purlay']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Garage: S3-compatible object storage for attachments (docs/spikes/object-storage.md).
  #
  # It has no console and its image has no shell, so the layout, the bucket and
  # the development key are created by `scripts/storage-init.sh`, which
  # `bun run db:up` runs once this reports healthy. Attachments are stored under
  # opaque keys and never served as public URLs — downloads are brokered by the
  # API so membership is actually checked (D-16, ARCHITECTURE.md §9).
  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:${STORAGE_PORT:-9000}:3900' # S3 API
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # The cloud's shared state (D-201): the bus, the limiters and presence. Nothing is kept — all of it is
  # ephemeral by design, and a restart is what the adapters' failure modes are tested against.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      # Loopback only, and overridable like the others.
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

volumes:
  postgres-data:
  garage-data:
