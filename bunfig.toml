# Read by `bun test`. Only the coverage floor lives here.
[test]
# Builds the integration template before the first test, outside any hook's five seconds.
preload = ["./packages/db/src/testing-preload.ts"]
# The floor `bun run test:all` holds the suite to when a database is reachable
# (#202). Bun applies it to **every file**, not to the total — measured — so one
# untested file fails the run however well the rest is covered. When it was
# introduced seven files were under it; they were tested, not excused. The suite
# then stood at 99.6 % of lines and 99.8 % of functions; the per-file floor leaves
# a new file room for an honest first version without letting one in untested.
# Never lowered to make a change pass (D-48).
coverageThreshold = { lines = 0.95, functions = 0.93 }

# Test-only code is not what ships, so it is not what the figures describe. Lint
# keeps production from importing it (`purlay/no-test-code-import`), which is what
# makes leaving it out safe: nothing that ships can hide there. The floor above
# still holds for every file that does ship. (#245)
coveragePathIgnorePatterns = ["apps/*/src/testing/**"]
